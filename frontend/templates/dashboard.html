<!-- frontend/templates/dashboard.html -->
<!-- Dashboard with trip input form -->

{% extends "base.html" %}

{% block title %}Dashboard - EV Charging System{% endblock %}

{% block content %}
<div class="card">
    <h2>Plan Your EV Trip in Bhubaneswar</h2>
    {% if error %}
    <div class="error-message" role="alert" aria-live="polite">{{ error }}</div>
    {% endif %}
    
    <form method="post" action="/predict" id="trip-form">
        <div class="form-group">
            <label for="start_name">Starting Location Name:</label>
            <input type="text" id="start_name" name="start_name" required placeholder="e.g., KIIT University">
        </div>
        
        <div class="form-group">
            <label for="dest_name">Destination Name:</label>
            <input type="text" id="dest_name" name="dest_name" required placeholder="e.g., Railway Station">
        </div>
        
        <div class="form-group">
            <label for="preset_destination">Select Destination (optional):</label>
            <select id="preset_destination" name="preset_destination">
                <option value="">-- Choose a preset --</option>
                <option value="kiit" data-lat="20.3050" data-lon="85.8150">KIIT University</option>
                <option value="railway" data-lat="20.2920" data-lon="85.8280">Railway Station</option>
                <option value="airport" data-lat="20.2700" data-lon="85.8200">Bhubaneswar Airport</option>
                <option value="master_canteen" data-lat="20.2920" data-lon="85.8280">Master Canteen</option>
                <option value="patia" data-lat="20.3000" data-lon="85.8200">Patia</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="battery_pct">Current Battery %:</label>
            <input type="number" id="battery_pct" name="battery_pct" required min="1" max="100" placeholder="Enter battery percentage">
        </div>
        
        <div class="form-group">
            <label for="distance_km">Distance to Destination (km):</label>
            <input type="number" id="distance_km" name="distance_km" required min="0" step="0.1" placeholder="Enter distance in km">
        </div>
        
        <div class="form-group">
            <label for="speed_kmh">Current Speed (km/h):</label>
            <input type="number" id="speed_kmh" name="speed_kmh" value="60" min="1" max="200">
        </div>
        
        <div class="form-group">
            <label for="temp_celsius">Outside Temperature (°C):</label>
            <input type="number" id="temp_celsius" name="temp_celsius" value="30" min="-10" max="60">
        </div>
        
        <div class="form-group">
            <label for="ac_on">AC Running?</label>
            <select id="ac_on" name="ac_on">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </div>
        
        <!-- Hidden fields for coordinates -->
        <input type="hidden" id="car_lat" name="car_lat" value="20.2961">
        <input type="hidden" id="car_lon" name="car_lon" value="85.8245">
        <input type="hidden" id="dest_lat" name="dest_lat" value="">
        <input type="hidden" id="dest_lon" name="dest_lon" value="">
        
        <button type="submit" class="btn btn-primary" id="submit-btn">Find Charging Stations →</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
// Preset destination coordinates
const presetDestinations = {
    kiit: { lat: 20.3050, lon: 85.8150 },
    railway: { lat: 20.2920, lon: 85.8280 },
    airport: { lat: 20.2700, lon: 85.8200 },
    master_canteen: { lat: 20.2920, lon: 85.8280 },
    patia: { lat: 20.3000, lon: 85.8200 }
};

// Handle preset destination selection
document.getElementById('preset_destination').addEventListener('change', function() {
    const selected = this.value;
    if (selected && presetDestinations[selected]) {
        document.getElementById('dest_lat').value = presetDestinations[selected].lat;
        document.getElementById('dest_lon').value = presetDestinations[selected].lon;
    }
});

// Get user's location
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        function(position) {
            document.getElementById('car_lat').value = position.coords.latitude;
            document.getElementById('car_lon').value = position.coords.longitude;
        },
        function(error) {
            console.log('Geolocation denied or failed, using default City Center');
        }
    );
}

// Disable submit button on form submit
document.getElementById('trip-form').addEventListener('submit', function() {
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Finding stations…';
});
</script>
{% endblock %}
