<!-- frontend/templates/base.html -->
<!-- Base template with header, navigation, and common layout -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}VoltRoute{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body{% if not show_nav %} class="auth-page"{% endif %}>
    {% if show_nav %}
    <header class="header">
        <div class="header-content">
            <a href="/dashboard" class="brand">
                <div class="brand-mark">⚡</div>
                <span class="brand-name">VoltRoute</span>
            </a>
            <nav class="header-nav" aria-label="Primary">
                <a href="/dashboard"{% if request.endpoint == 'dashboard' %} class="active"{% endif %}>Plan Trip</a>
                <a href="/history"{% if request.endpoint == 'history' %} class="active"{% endif %}>History</a>
                <a href="/logout">Logout</a>
            </nav>
        </div>
    </header>

    <nav class="bottom-nav" aria-label="Primary">
        <a href="/dashboard"{% if request.endpoint == 'dashboard' %} class="active"{% endif %}>
            <span class="material-symbols-outlined">route</span>
            <span>Plan Trip</span>
        </a>
        <a href="/history"{% if request.endpoint == 'history' %} class="active"{% endif %}>
            <span class="material-symbols-outlined">history</span>
            <span>History</span>
        </a>
        <a href="/logout">
            <span class="material-symbols-outlined">logout</span>
            <span>Logout</span>
        </a>
    </nav>
    {% endif %}

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
